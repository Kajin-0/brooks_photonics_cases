name: Case 001 data execution

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/case-001-data.yml"
      - "cases/001_wfc3_ir_ramp_anomaly/**"
      - "scripts/download_case_001.py"
      - "scripts/run_case_001.py"
      - "src/brooks_cases/**"

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Download pinned MAST products
        run: python scripts/download_case_001.py
      - name: Execute detector-ramp analysis
        run: python scripts/run_case_001.py
      - name: Upload derived case products
        uses: actions/upload-artifact@v4
        with:
          name: case-001-derived-products
          if-no-files-found: error
          retention-days: 30
          path: |
            cases/001_wfc3_ir_ramp_anomaly/data/raw/inventory.json
            cases/001_wfc3_ir_ramp_anomaly/data/derived/*.csv
            cases/001_wfc3_ir_ramp_anomaly/data/derived/*.json
            cases/001_wfc3_ir_ramp_anomaly/figures/*.png
