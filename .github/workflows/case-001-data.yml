name: Case 001 data execution

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/case-001-data.yml"
      - "BUILD_REPORTS.md"
      - "cases/001_wfc3_ir_ramp_anomaly/data/manifest.csv"
      - "cases/001_wfc3_ir_ramp_anomaly/report/**.md"
      - "scripts/download_case_001.py"
      - "scripts/run_case_001.py"
      - "src/brooks_cases/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/case-001-data.yml"
      - "BUILD_REPORTS.md"
      - "cases/001_wfc3_ir_ramp_anomaly/data/manifest.csv"
      - "cases/001_wfc3_ir_ramp_anomaly/report/**.md"
      - "scripts/download_case_001.py"
      - "scripts/run_case_001.py"
      - "src/brooks_cases/**"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: case-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPORT_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install report typography
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ibm-plex fonts-liberation
          fc-cache -f
      - run: python -m pip install -e ".[dev]"
      - name: Download pinned MAST products
        run: python scripts/download_case_001.py
      - name: Execute complete detector-ramp analysis
        run: python scripts/run_case_001.py
      - name: Verify required products
        run: |
          test -s cases/001_wfc3_ir_ramp_anomaly/report/Brooks_Photonics_Case_001.pdf
          test -s cases/001_wfc3_ir_ramp_anomaly/report/Brooks_Photonics_Case_001_Technical.pdf
          test -s cases/001_wfc3_ir_ramp_anomaly/data/derived/bootstrap_metrics.json
          test -s cases/001_wfc3_ir_ramp_anomaly/data/derived/flt_reconstruction_metrics.json
          test -s cases/001_wfc3_ir_ramp_anomaly/figures/representative_interval_maps.png
          test -s cases/001_wfc3_ir_ramp_anomaly/figures/robustness_summary.png
      - name: Assemble reproducible source package
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import shutil
          from pathlib import Path

          package_name = "Brooks_Photonics_Case_001_Reproducible_Source_Rev_1_7"
          dist = Path("dist")
          package_root = dist / package_name
          if package_root.exists():
              shutil.rmtree(package_root)
          package_root.mkdir(parents=True)

          for filename in (
              "README.md",
              "BUILD_REPORTS.md",
              "Makefile",
              "pyproject.toml",
              ".gitignore",
          ):
              source = Path(filename)
              if source.exists():
                  shutil.copy2(source, package_root / source.name)

          for directory in (".github", "scripts", "src", "tests"):
              shutil.copytree(directory, package_root / directory, dirs_exist_ok=True)

          case_source = Path("cases/001_wfc3_ir_ramp_anomaly")
          case_target = package_root / case_source

          def ignore_generated_noise(directory: str, names: list[str]) -> set[str]:
              ignored: set[str] = set()
              for name in names:
                  candidate = Path(directory) / name
                  if name in {"__pycache__", ".pytest_cache"}:
                      ignored.add(name)
                  elif candidate.is_file() and candidate.suffix.lower() == ".fits":
                      ignored.add(name)
              return ignored

          shutil.copytree(
              case_source,
              case_target,
              ignore=ignore_generated_noise,
              dirs_exist_ok=True,
          )
          (package_root / "SOURCE_COMMIT.txt").write_text(
              os.environ["REPORT_SOURCE_REF"] + "\n",
              encoding="utf-8",
          )
          shutil.make_archive(
              str(package_root),
              "zip",
              root_dir=package_root.parent,
              base_dir=package_root.name,
          )
          PY
      - name: Upload complete case products
        uses: actions/upload-artifact@v4
        with:
          name: case-001-complete-products
          if-no-files-found: error
          retention-days: 30
          path: |
            cases/001_wfc3_ir_ramp_anomaly/data/raw/inventory.json
            cases/001_wfc3_ir_ramp_anomaly/data/derived/*
            cases/001_wfc3_ir_ramp_anomaly/figures/*
            cases/001_wfc3_ir_ramp_anomaly/report/*.pdf
      - name: Upload reproducible source package
        uses: actions/upload-artifact@v4
        with:
          name: case-001-reproducible-source
          if-no-files-found: error
          retention-days: 30
          path: dist/Brooks_Photonics_Case_001_Reproducible_Source_Rev_1_7.zip
      - name: Commit generated portfolio products
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cases/001_wfc3_ir_ramp_anomaly/data/raw/inventory.json \
            cases/001_wfc3_ir_ramp_anomaly/data/derived \
            cases/001_wfc3_ir_ramp_anomaly/figures \
            cases/001_wfc3_ir_ramp_anomaly/report/*.pdf
          if git diff --cached --quiet; then
            echo "Generated products are unchanged."
          else
            git commit -m "Update generated Case 001 products [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
