name: Case 001 data execution

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/case-001-data.yml"
      - "cases/001_wfc3_ir_ramp_anomaly/data/manifest.csv"
      - "cases/001_wfc3_ir_ramp_anomaly/report/**.md"
      - "scripts/download_case_001.py"
      - "scripts/run_case_001.py"
      - "src/brooks_cases/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/case-001-data.yml"
      - "cases/001_wfc3_ir_ramp_anomaly/data/manifest.csv"
      - "cases/001_wfc3_ir_ramp_anomaly/report/**.md"
      - "scripts/download_case_001.py"
      - "scripts/run_case_001.py"
      - "src/brooks_cases/**"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: case-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPORT_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install report typography
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ibm-plex
          fc-cache -f
      - run: python -m pip install -e ".[dev]"
      - name: Download pinned MAST products
        run: python scripts/download_case_001.py
      - name: Execute complete detector-ramp analysis
        run: python scripts/run_case_001.py
      - name: Verify required products
        run: |
          test -s cases/001_wfc3_ir_ramp_anomaly/report/Brooks_Photonics_Case_001.pdf
          test -s cases/001_wfc3_ir_ramp_anomaly/report/Brooks_Photonics_Case_001_Technical.pdf
          test -s cases/001_wfc3_ir_ramp_anomaly/data/derived/bootstrap_metrics.json
          test -s cases/001_wfc3_ir_ramp_anomaly/data/derived/flt_reconstruction_metrics.json
          test -s cases/001_wfc3_ir_ramp_anomaly/figures/representative_interval_maps.png
          test -s cases/001_wfc3_ir_ramp_anomaly/figures/robustness_summary.png
      - name: Upload complete case products
        uses: actions/upload-artifact@v4
        with:
          name: case-001-complete-products
          if-no-files-found: error
          retention-days: 30
          path: |
            cases/001_wfc3_ir_ramp_anomaly/data/raw/inventory.json
            cases/001_wfc3_ir_ramp_anomaly/data/derived/*
            cases/001_wfc3_ir_ramp_anomaly/figures/*
            cases/001_wfc3_ir_ramp_anomaly/report/*.pdf
      - name: Commit generated portfolio products
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cases/001_wfc3_ir_ramp_anomaly/data/raw/inventory.json \
            cases/001_wfc3_ir_ramp_anomaly/data/derived \
            cases/001_wfc3_ir_ramp_anomaly/figures \
            cases/001_wfc3_ir_ramp_anomaly/report/*.pdf
          if git diff --cached --quiet; then
            echo "Generated products are unchanged."
          else
            git commit -m "Update generated Case 001 products [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
