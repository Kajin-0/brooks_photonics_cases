[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brooks-photonics-cases"
version = "0.1.0"
description = "Reproducible public-data detector characterization cases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "astropy>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "scipy>=1.12",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
